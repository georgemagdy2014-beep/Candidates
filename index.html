<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us – Leave Your Details</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 18px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5a6fd6; }
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error   { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Get Early Access</h1>
        <p class="subtitle">Leave your details and we’ll contact you soon.</p>

        <form id="leadForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">

            <label for="phone">Telephone</label>
            <input type="tel" id="phone" name="phone" required placeholder="+1 234 567 890">

            <button type="submit" id="submitBtn">Submit</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        // ←←← PASTE YOUR GOOGLE APPS SCRIPT URL HERE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzmIVH-bDa3xVt2kl7xrkZeyTNII8BjYCk1USINYVkBcjLERuwGLEQ7wrBGEus2C9pNQ/exec";

        const form = document.getElementById('leadForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            const data = {
                name:  document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                // Google Apps Script usually returns 200 even on success
                message.style.display = 'block';
                message.className = 'message success';
                message.textContent = 'Thank you! Your details have been saved.';
                form.reset();

            } catch (err) {
                message.style.display = 'block';
                message.className = 'message error';
                message.textContent = 'Something went wrong. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        });
    </script>
</body>
</html>
